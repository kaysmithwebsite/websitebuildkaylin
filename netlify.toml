# Netlify configuration for kaylinsmith.com
#
# The site is a static build. `dist/` is generated by build.py and is not
# committed, so a git-connected deploy needs the build command below. A manual
# or CLI deploy of an already-built `dist/` ignores [build.command] entirely.

[build]
  publish = "dist"
  command = "python3 build.py --production"

[build.environment]
  PYTHON_VERSION = "3.9"
  # @netlify/database requires Node >=20.6.1. package.json's presence at the
  # repo root means Netlify's build image installs Node dependencies before
  # running [build.command] below, so this must be pinned explicitly rather
  # than left to Netlify's own default.
  NODE_VERSION = "22"

# --------------------------------------------------------------------------
# CRM — Netlify Functions + Netlify Database
# --------------------------------------------------------------------------
# The public site (above) and the CRM (netlify/, db/, lib/) are two halves
# of the same deploy, not two projects: the zip-and-build upload includes
# both, Netlify builds dist/ from build.py AND bundles netlify/functions/,
# and applies netlify/database/migrations/ before the deploy is published.
# See NETLIFY_ARCHITECTURE.md.
[functions]
  directory = "netlify/functions"

# --------------------------------------------------------------------------
# Headers
# --------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), interest-cohort=()"
    # The noindex header was removed on 2026-09-10 for the production deploy.
    # Put it back, together with command = "python3 build.py --preview", to
    # return the site to a private preview.

# Asset URLs carry a content hash, so they can be cached hard and forever.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The guides are large. Cache them, but let a replacement land within a day.
[[headers]]
  for = "/assets/guides/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# HTML must revalidate so a rebuild is picked up immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# --------------------------------------------------------------------------
# Redirects
# --------------------------------------------------------------------------
# Trailing-slash canonicalisation is handled by Netlify's Pretty URLs setting.
# These cover paths a visitor or an old link might guess at.

[[redirects]]
  from = "/properties/*"
  to = "/real-estate/"
  status = 301

[[redirects]]
  from = "/home-evaluation"
  to = "/real-estate/sell/"
  status = 301

[[redirects]]
  from = "/calculators"
  to = "/resources/"
  status = 301

[[redirects]]
  from = "/guides"
  to = "/resources/guides/"
  status = 301

[[redirects]]
  from = "/mortgage-calculator"
  to = "/resources/mortgage-calculator/"
  status = 301

# Catch-all 404. Must stay last.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
